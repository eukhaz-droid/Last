<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Календарь">
<title>Календарь</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff}
*{box-sizing:border-box}
body{font-family:Arial,"Helvetica Neue",sans-serif;display:table;table-layout:fixed}
main{display:table-cell;width:100vw;height:100vh;vertical-align:middle;text-align:center;padding:1vh 2vw}
.line{width:100%;text-align:center;white-space:nowrap}
#date,#clock{font-size:6vw;font-weight:400;line-height:1.25;letter-spacing:.02em}
#weekday{font-size:15vw;font-weight:bold;line-height:1.08}
#hebrew{font-size:12vw;font-weight:300;line-height:1.12;direction:rtl}
</style>
</head>
<body>
<main>
<div class="line" id="date"></div>
<div class="line" id="weekday"></div>
<div class="line" id="hebrew" lang="he"></div>
<div class="line" id="clock"></div>
</main>
<script>
(function(){
var dateEl=document.getElementById('date'),dayEl=document.getElementById('weekday'),
hebrewEl=document.getElementById('hebrew'),clockEl=document.getElementById('clock'),lastDate='';
function pad(n){return n<10?'0'+n:''+n}
function update(){
var now=new Date(),key=now.getFullYear()+'-'+now.getMonth()+'-'+now.getDate();
if(key!==lastDate){
dateEl.textContent=now.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
dayEl.textContent=now.toLocaleDateString('ru-RU',{weekday:'long'});
hebrewEl.textContent=now.toLocaleDateString('he-IL',{weekday:'long'});
lastDate=key;
}
clockEl.textContent=pad(now.getHours())+':'+pad(now.getMinutes());
}
update();window.setInterval(update,1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)update()});
}());
</script>
</body>
</html>
